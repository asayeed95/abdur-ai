<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="og-pager-title og-pager-desc">
  <title id="og-pager-title">Your pager is not your customer</title>
  <desc id="og-pager-desc">Four evidence states: signal, diagnosis, mitigation, recovery. Pager is not the customer. No invented outage.</desc>
  <rect width="1200" height="630" fill="#0B0A08"/>
  <rect x="24" y="24" width="1152" height="582" fill="none" stroke="#2C2620" stroke-width="1"/>
  <rect x="24" y="24" width="8" height="582" fill="#D97757"/>
  <text x="72" y="82" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" letter-spacing="3" fill="#D97757">TLDR</text>
  <text x="72" y="154" font-family="'Playfair Display', 'Noto Serif', Georgia, serif" font-size="56" font-weight="700" fill="#F2EDE6">Your pager is not</text>
  <text x="72" y="222" font-family="'Playfair Display', 'Noto Serif', Georgia, serif" font-size="56" font-style="italic" fill="#F2EDE6">your customer</text>
  <rect x="72" y="248" width="60" height="3" fill="#D97757"/>
  <g>
    <rect x="72" y="292" width="268" height="96" rx="8" fill="#161310" stroke="#2C2620"/>
    <text x="92" y="326" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#D97757">1</text>
    <text x="124" y="326" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="700" fill="#F2EDE6">SIGNAL</text>
    <text x="92" y="360" font-family="Inter, ui-sans-serif, sans-serif" font-size="16" fill="#948B7D">Detector. Time. Identity.</text>
  </g>
  <g>
    <rect x="356" y="292" width="268" height="96" rx="8" fill="#161310" stroke="#2C2620"/>
    <text x="376" y="326" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#D97757">2</text>
    <text x="408" y="326" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="700" fill="#F2EDE6">DIAGNOSIS</text>
    <text x="376" y="360" font-family="Inter, ui-sans-serif, sans-serif" font-size="16" fill="#948B7D">A story that can be wrong.</text>
  </g>
  <g>
    <rect x="72" y="404" width="268" height="96" rx="8" fill="#161310" stroke="#2C2620"/>
    <text x="92" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#D97757">3</text>
    <text x="124" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="700" fill="#F2EDE6">MITIGATION</text>
    <text x="92" y="472" font-family="Inter, ui-sans-serif, sans-serif" font-size="16" fill="#948B7D">Less harm. Not recovery.</text>
  </g>
  <g>
    <rect x="356" y="404" width="268" height="96" rx="8" fill="#161310" stroke="#2C2620"/>
    <text x="376" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" font-weight="700" fill="#D97757">4</text>
    <text x="408" y="438" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" font-weight="700" fill="#F2EDE6">RECOVERY</text>
    <text x="376" y="472" font-family="Inter, ui-sans-serif, sans-serif" font-size="16" fill="#948B7D">A later independent probe.</text>
  </g>
  <text x="680" y="360" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="28" font-weight="700" fill="#948B7D">PAGER</text>
  <text x="680" y="430" font-family="'Playfair Display', 'Noto Serif', Georgia, serif" font-size="56" fill="#D97757">`</text>
  <text x="680" y="500" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="28" font-weight="700" fill="#F2EDE6">CUSTOMER</text>
  <text x="72" y="588" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="20" fill="#7A7264">abdur.ai</text>
  <text x="860" y="588" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18" fill="#7A7264">FOUR EVIDENCE STATES</text>
</svg>
