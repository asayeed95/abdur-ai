<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="720" viewBox="0 0 1200 720" role="img" aria-labelledby="f3t f3d">
  <title id="f3t">Rank by checkouts, not shelf views</title>
  <desc id="f3d">Two columns compare ranking by serves with ranking by uses. Ranking by serves lets the top results reinforce themselves while a new fact never surfaces. Ranking by uses, with an exploration slot reserved for new facts, promotes the new fact the agent acted on and sinks the one it ignored.</desc>
  <style>
    .mono{font-family:ui-monospace,"SF Mono",Menlo,monospace}
    .tag{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:22px;letter-spacing:4px;font-weight:700}
    .h{font-family:Georgia,"Times New Roman",serif;font-size:46px;font-weight:700;fill:#0B0A08}
    .col{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:26px;letter-spacing:3px;font-weight:700}
    .sub{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:22px;fill:#6E655C}
    .row{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:24px}
    .st{font-family:ui-monospace,"SF Mono",Menlo,monospace;font-size:22px}
  </style>
  <rect width="1200" height="720" fill="#F6F1E8"/>

  <text x="60" y="52" class="tag" fill="#D97757">FIG 3 · THE LIBRARY TEST</text>
  <text x="60" y="104" class="h">Rank by checkouts, not shelf views</text>

  <!-- LEFT CARD -->
  <rect x="60" y="130" width="520" height="490" rx="14" fill="none" stroke="#6E655C" stroke-width="2.5" stroke-dasharray="10 7"/>
  <text x="84" y="178" class="col" fill="#6E655C">RANK BY SERVES</text>
  <text x="84" y="212" class="sub">shelf views: seen when shown</text>

  <rect x="84" y="236" width="472" height="56" rx="8" fill="none" stroke="#6E655C" stroke-width="2"/>
  <text x="104" y="272" class="row" fill="#0B0A08">1  Fact A</text>
  <text x="540" y="272" class="st" fill="#6E655C" text-anchor="end">served</text>

  <rect x="84" y="304" width="472" height="56" rx="8" fill="none" stroke="#6E655C" stroke-width="2"/>
  <text x="104" y="340" class="row" fill="#0B0A08">2  Fact B</text>
  <text x="540" y="340" class="st" fill="#6E655C" text-anchor="end">served</text>

  <rect x="84" y="372" width="472" height="56" rx="8" fill="none" stroke="#6E655C" stroke-width="2"/>
  <text x="104" y="408" class="row" fill="#0B0A08">3  Fact C</text>
  <text x="540" y="408" class="st" fill="#6E655C" text-anchor="end">served</text>

  <line x1="84" y1="448" x2="556" y2="448" stroke="#0B0A08" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="84" y="478" class="sub">top-k cutoff</text>

  <rect x="84" y="494" width="472" height="56" rx="8" fill="none" stroke="#6E655C" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="104" y="530" class="row" fill="#6E655C">new  Fact N</text>
  <text x="540" y="530" class="st" fill="#D97757" text-anchor="end" font-weight="700">never surfaces</text>

  <text x="84" y="590" class="st" fill="#0B0A08">shown → scored up → shown</text>

  <!-- RIGHT CARD -->
  <rect x="620" y="130" width="520" height="490" rx="14" fill="none" stroke="#0B0A08" stroke-width="2.5"/>
  <text x="644" y="178" class="col" fill="#D97757">RANK BY USES</text>
  <text x="644" y="212" class="sub">checkouts: carried out the door</text>

  <rect x="644" y="228" width="472" height="76" rx="8" fill="#D97757"/>
  <text x="664" y="262" class="row" fill="#F6F1E8" font-weight="700">1  new Fact N</text>
  <text x="1100" y="262" class="st" fill="#F6F1E8" text-anchor="end" font-weight="700">used, rises</text>
  <text x="664" y="290" class="st" fill="#F6F1E8">given an exploration slot</text>

  <rect x="644" y="312" width="472" height="56" rx="8" fill="#D97757" fill-opacity="0.16" stroke="#D97757" stroke-width="2"/>
  <text x="664" y="348" class="row" fill="#0B0A08">2  Fact A</text>
  <text x="1100" y="348" class="st" fill="#0B0A08" text-anchor="end">used</text>

  <rect x="644" y="376" width="472" height="56" rx="8" fill="#D97757" fill-opacity="0.16" stroke="#D97757" stroke-width="2"/>
  <text x="664" y="412" class="row" fill="#0B0A08">3  Fact C</text>
  <text x="1100" y="412" class="st" fill="#0B0A08" text-anchor="end">used</text>

  <line x1="644" y1="452" x2="1116" y2="452" stroke="#0B0A08" stroke-width="2" stroke-dasharray="8 6"/>
  <text x="644" y="480" class="sub">top-k cutoff</text>

  <rect x="644" y="494" width="472" height="56" rx="8" fill="none" stroke="#6E655C" stroke-width="2" stroke-dasharray="6 6"/>
  <text x="664" y="530" class="row" fill="#6E655C">4  Fact B</text>
  <text x="1100" y="530" class="st" fill="#6E655C" text-anchor="end">ignored, sinks</text>

  <text x="644" y="590" class="st" fill="#0B0A08">acted on → scored up → surfaces</text>

  <!-- footer -->
  <text x="600" y="678" class="tag" fill="#D97757" text-anchor="middle">COUNT USES, NOT SERVES</text>
</svg>
