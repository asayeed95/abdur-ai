<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 920" role="img" aria-labelledby="fig-title fig-desc" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="fig-title">Four evidence states and the two timing budgets</title>
  <desc id="fig-desc">Two timing budgets in the same check: the abort that kills the probe fires at 100ms, long before the documented slow-warn at 2000ms. Four evidence states for the incident template: Signal, Diagnosis, Mitigation, Recovery.</desc>

  <rect x="1" y="1" width="718" height="918" rx="16" fill="#0E0C0A" stroke="#2C2620" stroke-width="2"/>

  <!-- Timing budgets: kept at the top so both values stay on-screen at narrow widths -->
  <text x="40" y="64" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3" fill="#948B7D">SAME CHECK &#183; TWO BUDGETS</text>

  <text x="40" y="130" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="44" font-weight="700" fill="#D97757">ABORT &#183; 100ms</text>
  <rect x="40" y="150" width="640" height="26" rx="6" fill="#1C1813" stroke="#2C2620"/>
  <rect x="40" y="150" width="32" height="26" rx="6" fill="#D97757"/>

  <text x="40" y="248" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="44" font-weight="700" fill="#F5C451">SLOW-WARN &#183; 2000ms</text>
  <rect x="40" y="268" width="640" height="26" rx="6" fill="#F5C451"/>

  <text x="40" y="338" font-size="23" fill="#C9C0B2">The abort kills the probe long before the warn.</text>

  <line x1="40" y1="374" x2="680" y2="374" stroke="#2C2620" stroke-width="2"/>

  <!-- Four evidence states -->
  <text x="40" y="418" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="24" letter-spacing="3" fill="#948B7D">FOUR EVIDENCE STATES</text>

  <g>
    <rect x="40" y="444" width="640" height="100" rx="12" fill="#161310" stroke="#2C2620"/>
    <text x="64" y="506" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#D97757">1</text>
    <text x="112" y="488" font-size="32" font-weight="700" letter-spacing="1.5" fill="#F2EDE6">SIGNAL</text>
    <text x="112" y="522" font-size="24" fill="#C9C0B2">A detector fired, with time and identity.</text>
  </g>

  <g>
    <rect x="40" y="558" width="640" height="100" rx="12" fill="#161310" stroke="#2C2620"/>
    <text x="64" y="620" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#F5C451">2</text>
    <text x="112" y="602" font-size="32" font-weight="700" letter-spacing="1.5" fill="#F2EDE6">DIAGNOSIS</text>
    <text x="112" y="636" font-size="24" fill="#C9C0B2">A causal story that can be wrong.</text>
  </g>

  <g>
    <rect x="40" y="672" width="640" height="100" rx="12" fill="#161310" stroke="#2C2620"/>
    <text x="64" y="734" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#C9C0B2">3</text>
    <text x="112" y="716" font-size="32" font-weight="700" letter-spacing="1.5" fill="#F2EDE6">MITIGATION</text>
    <text x="112" y="750" font-size="24" fill="#C9C0B2">Less harm or noise. Muting is not recovery.</text>
  </g>

  <g>
    <rect x="40" y="786" width="640" height="100" rx="12" fill="#161310" stroke="#2C2620"/>
    <text x="64" y="848" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="40" font-weight="700" fill="#6FCF97">4</text>
    <text x="112" y="830" font-size="32" font-weight="700" letter-spacing="1.5" fill="#F2EDE6">RECOVERY</text>
    <text x="112" y="864" font-size="24" fill="#C9C0B2">A later, independent probe. Not quiet Slack.</text>
  </g>
</svg>
