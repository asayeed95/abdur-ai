<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 770" role="img" aria-labelledby="fig-title fig-desc" font-family="'Inter', ui-sans-serif, system-ui, -apple-system, sans-serif">
  <title id="fig-title">Four evidence states and the two timing budgets</title>
  <desc id="fig-desc">Two timing budgets in the same check: the abort that kills the probe fires at 100ms, long before the documented slow-warn at 2000ms. Four evidence states for the incident template: Signal, Diagnosis, Mitigation, Recovery.</desc>

  <rect x="1" y="1" width="718" height="768" rx="16" fill="#000000" stroke="#3A3A3A" stroke-width="2"/>

  <!-- Timing budgets: kept at the top so both values stay on-screen at narrow widths -->
  <text x="40" y="56" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3" fill="#8A8A8A">SAME CHECK &#183; TWO BUDGETS</text>

  <text x="40" y="112" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="36" font-weight="700" fill="#FFFFFF">ABORT &#183; 100ms</text>
  <rect x="40" y="128" width="640" height="20" rx="5" fill="none" stroke="#555555"/>
  <rect x="40" y="128" width="32" height="20" rx="5" fill="#FFFFFF"/>

  <text x="40" y="212" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="36" font-weight="700" fill="#FFFFFF">SLOW-WARN &#183; 2000ms</text>
  <rect x="40" y="228" width="640" height="20" rx="5" fill="#FFFFFF"/>

  <text x="40" y="290" font-size="21" fill="#BBBBBB">The abort kills the probe long before the warn.</text>

  <line x1="40" y1="320" x2="680" y2="320" stroke="#3A3A3A" stroke-width="2"/>

  <!-- Four evidence states -->
  <text x="40" y="356" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="20" letter-spacing="3" fill="#8A8A8A">FOUR EVIDENCE STATES</text>

  <g>
    <rect x="40" y="376" width="640" height="84" rx="10" fill="none" stroke="#3A3A3A"/>
    <text x="64" y="429" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#FFFFFF">1</text>
    <text x="112" y="413" font-size="26" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">SIGNAL</text>
    <text x="112" y="443" font-size="20" fill="#BBBBBB">A detector fired, with time and identity.</text>
  </g>

  <g>
    <rect x="40" y="470" width="640" height="84" rx="10" fill="none" stroke="#3A3A3A"/>
    <text x="64" y="523" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#FFFFFF">2</text>
    <text x="112" y="507" font-size="26" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">DIAGNOSIS</text>
    <text x="112" y="537" font-size="20" fill="#BBBBBB">A causal story that can be wrong.</text>
  </g>

  <g>
    <rect x="40" y="564" width="640" height="84" rx="10" fill="none" stroke="#3A3A3A"/>
    <text x="64" y="617" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#FFFFFF">3</text>
    <text x="112" y="601" font-size="26" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">MITIGATION</text>
    <text x="112" y="631" font-size="20" fill="#BBBBBB">Less harm or noise. Muting is not recovery.</text>
  </g>

  <g>
    <rect x="40" y="658" width="640" height="84" rx="10" fill="none" stroke="#3A3A3A"/>
    <text x="64" y="711" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="32" font-weight="700" fill="#FFFFFF">4</text>
    <text x="112" y="695" font-size="26" font-weight="700" letter-spacing="1.5" fill="#FFFFFF">RECOVERY</text>
    <text x="112" y="725" font-size="20" fill="#BBBBBB">A later, independent probe. Not quiet Slack.</text>
  </g>
</svg>
